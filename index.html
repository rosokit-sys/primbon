<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Jawa & Primbon Lengkap</title>
<meta name="theme-color" content="#78350f">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-zoom { animation: zoom 0.5s ease-out; }
        @keyframes zoom {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .hide { display: none; }
        .tab-active { border-bottom: 3px solid #d97706; color: #d97706; }
        .ad-slot-container {
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f4;
            border: 2px dashed #d6d3d1;
            border-radius: 1.5rem;
            overflow: hidden;
        }
        .ad-small-box {
            min-height: 90px;
            background-color: #ffffff;
            border: 1px solid #e7e5e4;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 p-2 md:p-8">

<div id="app" class="max-w-6xl mx-auto space-y-6">
    <!-- Panel Detail Hari Utama -->
    <div id="detail-hari" class="bg-white rounded-3xl shadow-xl p-8 border-t-8 border-amber-600 text-center animate-zoom">
        <p id="label-hari" class="text-amber-600 text-xs font-black uppercase tracking-[0.4em] mb-4">Hari Ini</p>
        <div class="flex flex-col items-center">
            <h2 id="sel-date" class="text-8xl md:text-9xl font-black text-stone-900 tracking-tighter leading-none mb-2"></h2>
            <div class="space-y-1">
                <p id="sel-month-year" class="text-xl md:text-2xl text-stone-500 font-bold uppercase tracking-widest"></p>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="h-px w-8 bg-amber-200"></span>
                    <p id="sel-jawa" class="text-sm md:text-base text-amber-700 font-black italic"></p>
                    <span class="h-px w-8 bg-amber-200"></span>
                </div>
            </div>
        </div>
        
        <div id="holiday-info" class="mt-4 min-h-[1.5rem]">
            <p id="sel-holiday" class="text-red-600 font-bold text-sm uppercase tracking-wide"></p>
        </div>

        <div class="mt-6 flex flex-col items-center justify-center">
            <div class="bg-stone-900 text-white px-10 py-4 rounded-2xl shadow-2xl transform -rotate-1">
                <p id="sel-full-hari" class="text-3xl md:text-4xl font-black tracking-tight"></p>
            </div>
        </div>
    </div>

    <!-- KOLOM IKLAN KECIL -->
    <div class="ad-small-box shadow-sm animate-zoom p-2">
        <div class="text-center w-full">
            <span class="text-[9px] text-stone-300 absolute top-1 left-1 uppercase font-bold tracking-tighter">Advertisement</span>
            <div class="flex justify-center items-center">
                <ins class="adsbygoogle"
                     style="display:inline-block;width:320px;height:50px"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXXX"></ins>
                <script>
                     try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
                </script>
                <p class="text-[11px] text-stone-400 italic">Iklan Baris / Display 320x50</p>
            </div>
        </div>
    </div>

    <!-- Navigasi Utama -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-white/50 p-4 rounded-2xl border border-white/20 backdrop-blur-sm gap-4">
        <div class="flex items-center gap-4">
            <div class="flex bg-white rounded-xl p-1 shadow-sm border border-stone-200 text-xs font-bold">
                <button onclick="changeView('monthly')" id="btn-monthly" class="px-4 py-2 rounded-lg bg-stone-900 text-white shadow-lg transition-all">Bulanan</button>
                <button onclick="changeView('calculator')" id="btn-calc" class="px-4 py-2 rounded-lg text-stone-500 hover:bg-stone-50 transition-all">Primbon</button>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="prevYear()" class="p-2.5 bg-white hover:bg-stone-50 rounded-xl border border-stone-200 shadow-sm transition">Prev Year</button>
            <button onclick="goToday()" class="px-6 py-2.5 bg-stone-900 text-white rounded-xl text-xs font-bold shadow-lg">Hari Ini</button>
            <button onclick="nextYear()" class="p-2.5 bg-white hover:bg-stone-50 rounded-xl border border-stone-200 shadow-sm transition">Next Year</button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-8">
            
            <!-- VIEW: BULANAN -->
            <div id="monthly-view" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-stone-200">
                <div class="bg-stone-900 text-white p-8 flex justify-between items-center">
                    <div>
                        <h2 id="month-title" class="text-3xl font-black tracking-tight"></h2>
                        <p id="jawa-title" class="text-amber-400 text-xs font-bold uppercase tracking-widest mt-1"></p>
                    </div>
                    <div class="flex gap-2 text-white">
                        <button onclick="prevMonth()" class="p-3 hover:bg-stone-700 rounded-xl bg-stone-800"> < </button>
                        <button onclick="nextMonth()" class="p-3 hover:bg-stone-700 rounded-xl bg-stone-800"> > </button>
                    </div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 bg-stone-100 gap-px p-px"></div>
                <div id="monthly-holiday-footer" class="p-6 bg-stone-50 border-t border-stone-100">
                    <h4 class="text-[10px] font-black uppercase tracking-widest text-stone-400 mb-3">Hari Libur & Peringatan Bulan Ini</h4>
                    <div id="holiday-list" class="flex flex-wrap gap-2 text-xs"></div>
                </div>
            </div>

            <!-- VIEW: PRIMBON TERPADU -->
            <div id="calculator-view" class="hide bg-white rounded-3xl shadow-xl p-8 border border-stone-200">
                <div class="flex border-b border-stone-100 mb-8 overflow-x-auto">
                    <button onclick="switchTab('weton')" id="tab-weton" class="px-6 py-4 font-black uppercase tracking-widest text-xs tab-active whitespace-nowrap">Cek Weton</button>
                    <button onclick="switchTab('jodoh')" id="tab-jodoh" class="px-6 py-4 font-black uppercase tracking-widest text-xs text-stone-400 whitespace-nowrap">Weton Jodoh</button>
                    <button onclick="switchTab('nogodino')" id="tab-nogodino" class="px-6 py-4 font-black uppercase tracking-widest text-xs text-stone-400 whitespace-nowrap">Nogo Dino</button>
                    <button onclick="switchTab('kematian')" id="tab-kematian" class="px-6 py-4 font-black uppercase tracking-widest text-xs text-stone-400 whitespace-nowrap">Selamatan</button>
                </div>

                <p id="calc-context-label" class="text-amber-600 font-bold text-[10px] uppercase mb-4">Pilih Tanggal Lahir</p>

                <div id="input-container" class="grid grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-[10px] font-black text-stone-400 mb-2 uppercase">Tanggal</label>
                        <input type="number" id="manual-tgl" value="21" min="1" max="31" class="calc-input w-full p-4 bg-stone-50 rounded-2xl border border-stone-200 outline-none font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-stone-400 mb-2 uppercase">Bulan</label>
                        <select id="manual-bln" class="calc-input w-full p-4 bg-stone-50 rounded-2xl border border-stone-200 outline-none font-bold">
                            <option value="0">Januari</option><option value="1">Februari</option>
                            <option value="2">Maret</option><option value="3">April</option>
                            <option value="4">Mei</option><option value="5">Juni</option>
                            <option value="6">Juli</option><option value="7">Agustus</option>
                            <option value="8">September</option><option value="9">Oktober</option>
                            <option value="10">November</option><option value="11">Desember</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-stone-400 mb-2 uppercase">Tahun</label>
                        <input type="number" id="manual-thn" value="1995" class="calc-input w-full p-4 bg-stone-50 rounded-2xl border border-stone-200 outline-none font-bold">
                    </div>
                </div>

                <div id="extra-person" class="hide mb-6 space-y-4">
                    <p id="extra-label" class="font-black text-amber-600 text-[10px] uppercase">Data Pasangan</p>
                    <div class="grid grid-cols-3 gap-4">
                        <input type="number" id="extra-tgl" value="1" class="calc-input w-full p-4 bg-stone-50 rounded-2xl border border-stone-200 outline-none font-bold">
                        <select id="extra-bln" class="calc-input w-full p-4 bg-stone-50 rounded-2xl border border-stone-200 outline-none font-bold">
                            <option value="0">Januari</option><option value="1">Februari</option>
                            <option value="2">Maret</option><option value="3">April</option>
                            <option value="4">Mei</option><option value="5">Juni</option>
                            <option value="6">Juli</option><option value="7">Agustus</option>
                            <option value="8">September</option><option value="9">Oktober</option>
                            <option value="10">November</option><option value="11">Desember</option>
                        </select>
                        <input type="number" id="extra-thn" value="1995" class="calc-input w-full p-4 bg-stone-50 rounded-2xl border border-stone-200 outline-none font-bold">
                    </div>
                </div>

                <button id="calc-btn" onclick="executeCalculation()" class="w-full py-5 bg-stone-900 text-white font-black rounded-2xl shadow-xl hover:bg-stone-800 transition">Hitung Sekarang</button>
                
                <div id="res-container" class="mt-8 p-0 bg-transparent rounded-3xl hidden animate-zoom"></div>
            </div>
        </div>

        <!-- Sidebar Kanan -->
        <div class="space-y-8">
            <div class="bg-white rounded-3xl shadow-xl border border-stone-200 p-8">
                <h3 class="font-black uppercase tracking-widest text-sm text-stone-800 mb-6 flex items-center gap-2">Catatan Agenda</h3>
                <p id="agenda-date-label" class="text-[10px] text-amber-600 font-bold mb-2 uppercase tracking-tighter"></p>
                <textarea id="agenda-input" placeholder="Tulis rencana Anda di sini..." class="w-full h-40 p-5 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 outline-none text-sm resize-none mb-6 transition-all"></textarea>
                <div class="flex gap-3">
                    <button onclick="saveAgenda()" class="flex-1 bg-stone-900 text-white font-black py-4 rounded-2xl text-xs shadow-xl transition-transform active:scale-95">Simpan</button>
                    <button onclick="deleteAgenda()" class="px-5 bg-red-50 text-red-600 rounded-2xl border border-red-100 active:scale-95 transition-transform">Hapus</button>
                </div>
            </div>

            <!-- SLOT IKLAN SIDEBAR -->
            <div class="bg-white rounded-3xl shadow-xl p-6 border border-stone-200">
                <h3 class="font-black uppercase tracking-widest text-[10px] text-stone-400 mb-4 text-center">Sponsored Content</h3>
                <div class="bg-stone-50 rounded-2xl border border-stone-100 flex items-center justify-center p-8 text-center">
                    <div class="text-stone-300 italic text-[11px]">
                         <p>Iklan Sidebar</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const PASARAN = ['Legi', 'Pahing', 'Pon', 'Wage', 'Kliwon'];
    const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const BULAN_JAWA = [
        { nama: 'Suro', hari: 30 }, { nama: 'Sapar', hari: 29 }, { nama: 'Mulud', hari: 30 },
        { nama: 'Bakda Mulud', hari: 29 }, { nama: 'Jumadil Awal', hari: 30 }, { nama: 'Jumadil Akhir', hari: 29 },
        { nama: 'Rajab', hari: 30 }, { nama: 'Ruwah', hari: 29 }, { nama: 'Pasa', hari: 30 },
        { nama: 'Sawal', hari: 29 }, { nama: 'Sela', hari: 30 }, { nama: 'Besar', hari: 29 }
    ];

    const NEPTU_HARI = { 'Minggu': 5, 'Senin': 4, 'Selasa': 3, 'Rabu': 7, 'Kamis': 8, 'Jumat': 6, 'Sabtu': 9 };
    const NEPTU_PASARAN = { 'Legi': 5, 'Pahing': 9, 'Pon': 7, 'Wage': 4, 'Kliwon': 8 };

    const SHIO = ["Monyet", "Ayam", "Anjing", "Babi", "Tikus", "Kerbau", "Macan", "Kelinci", "Naga", "Ular", "Kuda", "Kambing"];
    const ELEMEN = ["Logam", "Logam", "Air", "Air", "Kayu", "Kayu", "Api", "Api", "Tanah", "Tanah"];
    
    // Database Karakter Weton Tradisional
    const KARAKTER_WETON = {
        "Minggu": "Mandiri, berwibawa, dan suka menolong.",
        "Senin": "Murah hati, pandai bicara, dan rapi.",
        "Selasa": "Kuat pendirian, pemberani, dan gesit.",
        "Rabu": "Ramah, berjiwa pemimpin, namun kadang keras kepala.",
        "Kamis": "Pekerja keras, ambisius, dan penyabar.",
        "Jumat": "Suka keindahan, romantis, dan kreatif.",
        "Sabtu": "Tanggung jawab tinggi, pendiam, namun setia.",
        "Legi": "Jujur, pemaaf, dan berwawasan luas.",
        "Pahing": "Cerdas, teliti, namun sering curiga.",
        "Pon": "Berani, dermawan, namun mudah tersinggung.",
        "Wage": "Rajin, penurut, dan suka kedamaian.",
        "Kliwon": "Berjiwa seni, berwibawa, dan spiritual."
    };

    const INDO_HOLIDAYS = {
        "fixed": { "01-01": "Tahun Baru Masehi", "05-01": "Hari Buruh Internasional", "06-01": "Hari Lahir Pancasila", "08-17": "Hari Kemerdekaan RI", "12-25": "Hari Raya Natal" },
        "2025": { "01-27": "Isra Mi'raj", "01-29": "Tahun Baru Imlek", "03-29": "Hari Suci Nyepi", "03-31": "Idul Fitri", "04-01": "Idul Fitri", "04-18": "Wafat Yesus Kristus", "04-20": "Hari Paskah", "05-12": "Hari Raya Waisak", "05-29": "Kenaikan Yesus Kristus", "06-06": "Idul Adha", "06-27": "Tahun Baru Islam", "09-05": "Maulid Nabi" },
        "2026": { "02-14": "Isra Mi'raj", "02-17": "Tahun Baru Imlek", "03-19": "Hari Suci Nyepi", "03-20": "Idul Fitri", "03-21": "Idul Fitri", "04-03": "Wafat Yesus Kristus", "04-05": "Hari Paskah", "05-14": "Kenaikan Yesus Kristus", "05-27": "Idul Adha", "05-31": "Hari Raya Waisak", "06-16": "Tahun Baru Islam", "08-25": "Maulid Nabi" }
    };

    function getHoliday(date) {
        const d = new Date(date);
        const mmdd = `${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const year = d.getFullYear().toString();
        if (INDO_HOLIDAYS.fixed[mmdd]) return INDO_HOLIDAYS.fixed[mmdd];
        if (INDO_HOLIDAYS[year] && INDO_HOLIDAYS[year][mmdd]) return INDO_HOLIDAYS[year][mmdd];
        return null;
    }

    const REF_EPOCH = new Date(1970, 0, 1);
    const REF_PASARAN_EPOCH = 3; 
    const REF_JAWA_FIXED = { date: new Date(2026, 0, 1), tgl: 11, blnIdx: 6, thn: 1959 };

    let viewMode = 'monthly';
    let activeTab = 'weton';
    let currentDate = new Date();
    let selectedDate = new Date();
    let agendas = JSON.parse(localStorage.getItem('kal_agendas') || '{}');

    function shareToWhatsApp(text) {
        const fullText = `${text}\n\n_Cek selengkapnya di:_ https://rosokit-sys.github.io/primbon/\n\n_Dikirim dari Kalender Jawa & Primbon ✨_`;
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(fullText)}`;
        window.open(url, '_blank');
    }

    function getJawaData(date) {
        const d = new Date(date); d.setHours(0,0,0,0);
        const diffFromEpoch = Math.floor((d.getTime() - REF_EPOCH.getTime()) / (1000 * 60 * 60 * 24));
        let pIndex = (REF_PASARAN_EPOCH + diffFromEpoch) % 5;
        if (pIndex < 0) pIndex += 5;
        const pasaran = PASARAN[pIndex];
        const diffFromRef = Math.floor((d.getTime() - REF_JAWA_FIXED.date.getTime()) / (1000 * 60 * 60 * 24));
        let totalJawaDays = REF_JAWA_FIXED.tgl + diffFromRef;
        let curBlnIdx = REF_JAWA_FIXED.blnIdx;
        let curThn = REF_JAWA_FIXED.thn;

        if (diffFromRef >= 0) {
            while (totalJawaDays > (BULAN_JAWA[curBlnIdx]?.hari || 30)) {
                totalJawaDays -= BULAN_JAWA[curBlnIdx]?.hari || 30;
                curBlnIdx++; if (curBlnIdx > 11) { curBlnIdx = 0; curThn++; }
            }
        } else {
            while (totalJawaDays <= 0) {
                curBlnIdx--; if (curBlnIdx < 0) { curBlnIdx = 11; curThn--; }
                totalJawaDays += BULAN_JAWA[curBlnIdx]?.hari || 30;
            }
        }
        return { 
            tgl: totalJawaDays, 
            bulan: BULAN_JAWA[curBlnIdx]?.nama || 'Suro', 
            tahun: curThn, 
            pasaran: pasaran, 
            neptuHari: NEPTU_HARI[HARI[d.getDay()]],
            neptuPasaran: NEPTU_PASARAN[pasaran],
            neptu: NEPTU_HARI[HARI[d.getDay()]] + NEPTU_PASARAN[pasaran] 
        };
    }

    function calculateAge(birthDate) {
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
        return age;
    }

    function switchTab(tab) {
        activeTab = tab;
        ['weton', 'jodoh', 'kematian', 'nogodino'].forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if (btn) { 
                btn.classList.toggle('tab-active', t === tab); 
                btn.classList.toggle('text-stone-400', t !== tab); 
            }
        });
        
        const extraPanel = document.getElementById('extra-person');
        const extraLabel = document.getElementById('extra-label');
        const contextLabel = document.getElementById('calc-context-label');
        const resContainer = document.getElementById('res-container');

        if (tab === 'jodoh') {
            extraPanel.classList.remove('hide');
            extraLabel.innerText = "Data Pasangan (Tanggal Lahir)";
            contextLabel.innerText = "Pilih Tanggal Lahir Anda";
        } else {
            extraPanel.classList.add('hide');
            contextLabel.innerText = tab === 'kematian' ? "Pilih Tanggal Meninggal" : "Pilih Tanggal Lahir";
        }

        if (resContainer) resContainer.classList.add('hidden');
    }

    function executeCalculation() {
        const tInput = document.getElementById('manual-tgl'), bInput = document.getElementById('manual-bln'), hInput = document.getElementById('manual-thn');
        if(!tInput || !bInput || !hInput) return;
        const d = new Date(hInput.value, bInput.value, tInput.value);
        if (isNaN(d.getTime())) return;

        const res = document.getElementById('res-container');
        res.classList.remove('hidden');
        res.innerHTML = '';

        if (activeTab === 'weton') hitungWeton(d, res);
        else if (activeTab === 'jodoh') hitungJodoh(d, res);
        else if (activeTab === 'kematian') hitungKematian(d, res);
        else if (activeTab === 'nogodino') hitungNogoDino(d, res);
    }

    function hitungWeton(birthDate, el) {
        const jd = getJawaData(birthDate), age = calculateAge(birthDate), shio = SHIO[birthDate.getFullYear() % 12], ele = ELEMEN[birthDate.getFullYear() % 10];
        const hariNama = HARI[birthDate.getDay()];
        const pasaranNama = jd.pasaran;
        
        // Logika Angka Hoki deterministik
        const seed = birthDate.getFullYear() * 10000 + (birthDate.getMonth() + 1) * 100 + birthDate.getDate();
        const luckyNumbers = Array.from({length: 4}, (_, i) => (((seed * (i + 17)) % 90) + 10));
        
        const summaryText = `Weton: ${hariNama} ${pasaranNama}, Neptu: ${jd.neptu}, Shio: ${shio}, Angka Hoki: ${luckyNumbers.join(', ')}`;
        const karakterTeks = `Sifat hari ${hariNama}: ${KARAKTER_WETON[hariNama]} Pasaran ${pasaranNama}: ${KARAKTER_WETON[pasaranNama]}`;

        el.innerHTML = `
            <div class="space-y-6">
                <div class="bg-stone-900 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                    <div class="flex justify-between items-start mb-8">
                        <div><p class="text-amber-500 font-black uppercase text-[10px] tracking-[0.2em] mb-1">Hasil Analisa Weton</p><h4 class="text-4xl font-black tracking-tighter">${hariNama} ${pasaranNama}</h4><p class="text-stone-400 font-bold text-xs mt-1 uppercase tracking-widest">${jd.tgl} ${jd.bulan} ${jd.tahun} AJ</p></div>
                        <div class="text-right"><div class="bg-amber-600 px-4 py-2 rounded-xl inline-block mb-2"><p class="text-[10px] uppercase font-black text-amber-100 leading-none">Usia</p><p class="text-2xl font-black">${age}</p></div><div class="block"><p class="text-2xl font-black text-amber-400">${jd.neptu}</p></div></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/10"><p class="text-[10px] opacity-50 mb-1">Shio</p><p class="font-black text-xl">${shio}</p></div>
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/10"><p class="text-[10px] opacity-50 mb-1">Elemen</p><p class="font-black text-xl">${ele}</p></div>
                    </div>
                    <div class="mt-6 pt-6 border-t border-white/10 grid grid-cols-2 gap-4 text-xs">
                        <div><p class="opacity-50">Neptu Hari (${hariNama})</p><p class="font-bold text-amber-400 text-lg">${jd.neptuHari}</p></div>
                        <div><p class="opacity-50">Neptu Pasaran (${pasaranNama})</p><p class="font-bold text-amber-400 text-lg">${jd.neptuPasaran}</p></div>
                    </div>
                </div>

                <!-- Angka Hoki -->
                <div class="bg-amber-50 p-6 rounded-3xl border border-amber-100 text-center">
                    <p class="text-[10px] font-black uppercase text-amber-600 mb-4 tracking-[0.2em]">Angka Hoki Kelahiran ✨</p>
                    <div class="flex justify-center gap-3">
                        ${luckyNumbers.map(n => `<div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm border border-amber-200"><span class="text-xl font-black text-stone-800">${n}</span></div>`).join('')}
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm text-center">
                    <p class="text-[10px] font-black uppercase text-amber-600 mb-3 tracking-widest">Karakter Dasar</p>
                    <p class="text-sm leading-relaxed text-stone-600 italic">"${karakterTeks}"</p>
                </div>

                <button onclick="shareToWhatsApp('${summaryText}')" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black text-sm hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                    Bagikan ke WhatsApp 📱
                </button>
            </div>`;
    }

    function hitungJodoh(d1, el) {
        const et = document.getElementById('extra-tgl'), eb = document.getElementById('extra-bln'), eh = document.getElementById('extra-thn');
        const d2 = new Date(eh.value, eb.value, et.value);
        const jd1 = getJawaData(d1), jd2 = getJawaData(d2), total = jd1.neptu + jd2.neptu, sisa = total % 8;
        const shio1 = SHIO[d1.getFullYear() % 12], shio2 = SHIO[d2.getFullYear() % 12];
        
        const hasil = ["PESHTI", "PEGAT", "RATU", "JODOH", "TOPO", "TINARI", "PADU", "SUJANAN"], 
              desc = ["Harmonis selalu.", "Sering masalah.", "Beruntung rezekinya.", "Sangat Cocok.", "Sulit di awal.", "Murah rezeki.", "Cekcok mulut.", "Godaan ketiga."];
        
        el.innerHTML = `
            <div class="space-y-6">
                <div class="bg-stone-50 p-6 rounded-3xl border border-stone-200 space-y-4">
                    <p class="text-[10px] font-black uppercase text-stone-400 tracking-widest">Rincian Perhitungan</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-stone-100 shadow-sm">
                            <p class="text-[9px] font-bold text-stone-400 uppercase mb-2">Anda</p>
                            <p class="font-black text-stone-900 text-base">${HARI[d1.getDay()]} ${jd1.pasaran}</p>
                            <p class="text-xs font-bold text-amber-600 mb-2">Neptu: ${jd1.neptu} | Shio: ${shio1}</p>
                            <div class="mt-2 pt-2 border-t border-stone-50 text-[10px] text-stone-500 italic">
                                ${KARAKTER_WETON[HARI[d1.getDay()]]}
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-stone-100 shadow-sm">
                            <p class="text-[9px] font-bold text-stone-400 uppercase mb-2">Pasangan</p>
                            <p class="font-black text-stone-900 text-base">${HARI[d2.getDay()]} ${jd2.pasaran}</p>
                            <p class="text-xs font-bold text-amber-600 mb-2">Neptu: ${jd2.neptu} | Shio: ${shio2}</p>
                            <div class="mt-2 pt-2 border-t border-stone-50 text-[10px] text-stone-500 italic">
                                ${KARAKTER_WETON[HARI[d2.getDay()]]}
                            </div>
                        </div>
                    </div>
                    <div class="bg-amber-100/50 p-4 rounded-2xl text-center border border-amber-200">
                        <p class="text-xs font-bold text-amber-800">Rumus: (${jd1.neptu} + ${jd2.neptu}) mod 8 = Sisa ${sisa}</p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-8 border border-stone-200 text-center animate-zoom shadow-xl">
                    <p class="text-[10px] font-black uppercase text-amber-600 mb-2">Total Neptu: ${total}</p>
                    <h4 class="text-5xl font-black text-stone-900 mb-2 tracking-tighter">${hasil[sisa]}</h4><p class="text-sm text-stone-500 mb-6">"${desc[sisa]}"</p>
                    <button onclick="shareToWhatsApp('Hasil Cek Jodoh: ${hasil[sisa]} (${desc[sisa]}). Total Neptu Kami: ${total}')" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black text-sm flex items-center justify-center gap-2">
                        Bagikan ke WhatsApp 📱
                    </button>
                </div>
            </div>`;
    }

    function hitungNogoDino(d, el) {
        const jd = getJawaData(d), nogoMap = { 'Legi': 'Timur', 'Pahing': 'Selatan', 'Pon': 'Barat', 'Wage': 'Utara', 'Kliwon': 'Tengah' };
        const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        const luckyNumbers = Array.from({length: 4}, (_, i) => (((seed * (i + 13)) % 90) + 10));

        el.innerHTML = `
            <div class="animate-zoom space-y-6">
                <div class="p-8 bg-amber-50 border-2 border-amber-200 rounded-[2.5rem] text-center shadow-inner">
                    <p class="text-[10px] font-black uppercase text-amber-600 mb-4">Arah Naga (${HARI[d.getDay()]} ${jd.pasaran})</p>
                    <h4 class="text-4xl font-black text-stone-900 mb-2 tracking-tight">${nogoMap[jd.pasaran]}</h4>
                    <div class="grid grid-cols-2 gap-4 mt-6">
                        <div class="p-4 bg-white rounded-2xl shadow-sm border border-stone-100"><p class="text-[9px] font-bold text-stone-400 uppercase mb-1">Arah Jaya</p><p class="text-sm font-black text-emerald-600 uppercase">${nogoMap[jd.pasaran] === 'Utara' ? 'Selatan' : 'Utara'}</p></div>
                        <div class="p-4 bg-white rounded-2xl shadow-sm border border-stone-100"><p class="text-[9px] font-bold text-stone-400 uppercase mb-1">Arah Rezeki</p><p class="text-sm font-black text-blue-600 uppercase">${nogoMap[jd.pasaran] === 'Timur' ? 'Barat' : 'Timur'}</p></div>
                    </div>
                </div>
                <div class="bg-white p-8 rounded-[2.5rem] border border-stone-200 text-center shadow-lg relative overflow-hidden">
                    <p class="text-[10px] font-black uppercase text-stone-400 mb-6 tracking-[0.2em]">Angka Hoki Hari Ini ✨</p>
                    <div class="flex justify-center gap-3">${luckyNumbers.map(n => `<div class="w-14 h-14 bg-stone-900 rounded-2xl flex items-center justify-center shadow-xl"><span class="text-2xl font-black text-amber-400">${n}</span></div>`).join('')}</div>
                    <div class="mt-6">
                        <button onclick="shareToWhatsApp('Arah Naga: ${nogoMap[jd.pasaran]}. Angka Hoki: ${luckyNumbers.join(', ')}')" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs">Kirim ke WA 📱</button>
                    </div>
                </div>
            </div>`;
    }

    function hitungKematian(start, el) {
        const addDays = (d, n) => { let r = new Date(d); r.setDate(r.getDate() + (n - 1)); return r; };
        const items = [
            { l: '3 Hari', d: 3 }, 
            { l: '7 Hari', d: 7 }, 
            { l: '40 Hari', d: 40 }, 
            { l: '100 Hari', d: 100 }, 
            { l: 'Pendhak 1', d: 355 }, 
            { l: 'Pendhak 2', d: 709 }, // Penambahan Pendhak 2 (2 tahun Jawa)
            { l: '1000 Hari', d: 1000 }
        ];
        let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
        items.forEach(i => {
            const target = addDays(start, i.d), jd = getJawaData(target);
            html += `<div class="p-5 bg-white border border-stone-200 rounded-3xl"><p class="text-[10px] font-black text-amber-600 uppercase mb-1">${i.l}</p><p class="font-black text-stone-900 text-sm">${target.getDate()} ${BULAN[target.getMonth()]} ${target.getFullYear()}</p><p class="text-[10px] text-stone-400 font-bold">${HARI[target.getDay()]} ${jd.pasaran}</p></div>`;
        });
        el.innerHTML = html + '</div>';
    }

    function renderDetail() {
        const jd = getJawaData(selectedDate), holiday = getHoliday(selectedDate);
        const elements = ['sel-date', 'sel-month-year', 'sel-jawa', 'sel-full-hari', 'agenda-date-label', 'agenda-input', 'manual-tgl', 'manual-bln', 'manual-thn'];
        const values = [selectedDate.getDate(), `${BULAN[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`, `${jd.tgl} ${jd.bulan} ${jd.tahun} AJ, ${jd.pasaran}`, `${HARI[selectedDate.getDay()]} <span class="text-amber-400">${jd.pasaran}</span>`, `Agenda: ${selectedDate.getDate()} ${BULAN[selectedDate.getMonth()]}`, agendas[selectedDate.toDateString()] || '', selectedDate.getDate(), selectedDate.getMonth(), selectedDate.getFullYear()];
        elements.forEach((id, i) => { const el = document.getElementById(id); if (el) { if (id === 'sel-full-hari') el.innerHTML = values[i]; else if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') el.value = values[i]; else el.innerText = values[i]; } });
        const hEl = document.getElementById('sel-holiday'); if (hEl) hEl.innerText = holiday || "";
    }

    function renderCalendar() {
        if (viewMode !== 'monthly') return;
        const grid = document.getElementById('calendar-grid'); if (!grid) return;
        grid.innerHTML = ''; ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].forEach((h, i) => { grid.innerHTML += `<div class="py-4 text-center text-[10px] uppercase font-black bg-stone-50 ${i===0?'text-red-500':'text-stone-400'}">${h}</div>`; });
        const y = currentDate.getFullYear(), m = currentDate.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
        const mt = document.getElementById('month-title'), jt = document.getElementById('jawa-title');
        if (mt) mt.innerText = `${BULAN[m]} ${y}`; const sJ = getJawaData(new Date(y, m, 1)), eJ = getJawaData(new Date(y, m, days)); if (jt) jt.innerText = `${sJ.bulan} - ${eJ.bulan} ${sJ.tahun}`;
        const hl = document.getElementById('holiday-list'); if (hl) hl.innerHTML = "";
        for(let i=0; i<first; i++) grid.innerHTML += `<div class="h-24 md:h-32 bg-stone-50/30"></div>`;
        for(let i=1; i<=days; i++) {
            const d = new Date(y, m, i), ds = d.toDateString(), jd = getJawaData(d), holiday = getHoliday(d);
            const isSel = ds === selectedDate.toDateString(), isToday = ds === new Date().toDateString(), isRed = d.getDay() === 0 || holiday;
            if (holiday && hl) hl.innerHTML += `<div class="bg-red-50 text-red-600 px-2 py-1 rounded border border-red-100"><b>${i}</b>: ${holiday}</div>`;
            grid.innerHTML += `<div onclick="selectDate(${y}, ${m}, ${i})" class="h-24 md:h-32 p-3 cursor-pointer border-r border-b border-stone-100 relative ${isSel ? 'bg-amber-50 ring-4 ring-amber-500/20 z-10' : (isToday ? 'bg-emerald-50' : 'bg-white hover:bg-stone-50')}"><div class="h-full w-full flex flex-col justify-between"><div class="flex justify-between items-start"><span class="text-xl font-bold ${isRed ? 'text-red-600' : 'text-stone-800'}">${i}</span>${agendas[ds] ? '<div class="w-2 h-2 bg-blue-500 rounded-full"></div>' : ''}</div><div class="flex flex-col text-[9px] font-bold text-stone-400"><span>${jd.tgl} ${jd.bulan.substring(0,3)}</span><span class="bg-stone-100 text-stone-600 p-0.5 rounded uppercase mt-0.5 w-fit">${jd.pasaran}</span></div></div></div>`;
        }
    }

    function changeView(m) {
        viewMode = m; const mv = document.getElementById('monthly-view'), cv = document.getElementById('calculator-view'), bm = document.getElementById('btn-monthly'), bc = document.getElementById('btn-calc');
        if (mv) mv.classList.toggle('hide', m !== 'monthly'); if (cv) cv.classList.toggle('hide', m !== 'calculator');
        if (bm) { bm.classList.toggle('bg-stone-900', m === 'monthly'); bm.classList.toggle('text-white', m === 'monthly'); }
        if (bc) { bc.classList.toggle('bg-stone-900', m === 'calculator'); bc.classList.toggle('text-white', m === 'calculator'); }
        if (m === 'monthly') renderCalendar();
    }

    function selectDate(y, m, d) { selectedDate = new Date(y, m, d); renderDetail(); renderCalendar(); }
    function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
    function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
    function prevYear() { currentDate.setFullYear(currentDate.getFullYear() - 1); renderCalendar(); }
    function nextYear() { currentDate.setFullYear(currentDate.getFullYear() + 1); renderCalendar(); }
    function goToday() { currentDate = new Date(); selectedDate = new Date(); renderCalendar(); renderDetail(); }
    function saveAgenda() {
        const input = document.getElementById('agenda-input'); if (!input) return; const v = input.value;
        if(v.trim()) agendas[selectedDate.toDateString()] = v; else delete agendas[selectedDate.toDateString()];
        localStorage.setItem('kal_agendas', JSON.stringify(agendas)); renderCalendar();
    }
    function deleteAgenda() {
        const input = document.getElementById('agenda-input'); delete agendas[selectedDate.toDateString()];
        if (input) input.value = ''; localStorage.setItem('kal_agendas', JSON.stringify(agendas)); renderCalendar();
    }

    window.onload = () => { renderDetail(); renderCalendar(); };
</script>
</body>
</html>
